spring:
  application:
    name: switchprep-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Override in production with the APP_JWT_SECRET env var (at least 32 characters).
    secret: ${APP_JWT_SECRET:change-me-dev-secret-change-me-dev-secret-0123456789}
    expiration-days: ${APP_JWT_EXPIRATION_DAYS:30}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/switchprep;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/switchprep?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Raffin@786}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
