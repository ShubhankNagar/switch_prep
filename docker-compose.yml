# MySQL for the "mysql" Spring profile. Start: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: switchprep
    ports:
      - "3306:3306"
    volumes:
      - switchprep-mysql:/var/lib/mysql
volumes:
  switchprep-mysql:
